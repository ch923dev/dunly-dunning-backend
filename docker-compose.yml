services:
  postgres:
    image: postgres:17-alpine
    container_name: dunly-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dunly
    ports:
      - "5432:5432"
    volumes:
      - dunly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dunly"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dunly_pgdata:
